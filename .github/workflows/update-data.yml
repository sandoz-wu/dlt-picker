name: update-data
on:
  schedule:
    # 周一/三/六 21:40 北京时间（= 13:40 UTC），开奖后约 15 分钟
    - cron: "40 13 * * 1,3,6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest draws
        run: |
          cat > update.mjs <<'EOF'
          const API = "https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=30&isVerify=1&pageNo=1";
          // 2026-11-07 起官方接口 WAF 拦截无浏览器头的请求（实测 HTTP 567），必须带 UA/Referer
          const HEADERS = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
            "Accept": "application/json, text/plain, */*",
            "Referer": "https://static.sporttery.cn/",
            "Origin": "https://static.sporttery.cn",
          };
          let list = [], lastErr = null;
          for (let a = 1; a <= 3; a++) {
            try {
              const r = await fetch(API, { headers: HEADERS });
              if (!r.ok) throw new Error("HTTP " + r.status);
              list = (await r.json())?.value?.list || [];
              if (list.length) break;
              throw new Error("empty list");
            } catch (e) { lastErr = e; }
          }
          if (!list.length) { console.error("fetch failed after 3 attempts:", lastErr); process.exit(1); }
          const fs = await import("node:fs");
          const path = "data_snapshot.json";
          const cur = JSON.parse(fs.readFileSync(path, "utf8"));
          const maxOld = cur.draws[0][0];
          const fresh = [];
          for(const x of list){
            const i = parseInt(x.lotteryDrawNum, 10);
            if(i <= maxOld) continue;
            const n = (x.lotteryDrawResult || "").trim().split(/\s+/).map(Number);
            if(n.length !== 7) continue;
            const f = n.slice(0,5).sort((a,b)=>a-b), b = n.slice(5).sort((a,b)=>a-b);
            const okf = new Set(f).size===5 && f.every(v=>v>=1&&v<=35);
            const okb = new Set(b).size===2 && b.every(v=>v>=1&&v<=12);
            if(!okf || !okb){ console.error("bad draw", i); process.exit(1); }
            fresh.push([i, x.lotteryDrawTime.slice(0,10), f, b]);
          }
          if(!fresh.length){ console.log("already up to date at", maxOld); process.exit(0); }
          fresh.sort((a,b)=>b[0]-a[0]);
          cur.draws = [...fresh, ...cur.draws];
          cur.total = cur.draws.length;
          cur.updated = cur.draws[0][1];
          fs.writeFileSync(path, JSON.stringify(cur));
          console.log("added", fresh.length, "draw(s); latest =", cur.draws[0][0]);
          EOF
          node update.mjs
      - name: Commit & push
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: auto update $(date -u +%F)"
            git push
          fi
