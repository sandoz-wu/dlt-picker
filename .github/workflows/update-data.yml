name: update-data
on:
  schedule:
    # 周一/三/六 21:40 北京时间（= 13:40 UTC），开奖后约 15 分钟
    - cron: "40 13 * * 1,3,6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest draws
        run: |
          cat > update.mjs <<'EOF'
          // 双源取数：① 体彩官方接口（2026-11 起其 WAF 拦截 GitHub 出口 IP，仅作首选尝试）
          //          ② 500彩票网历史页兜底（GitHub 可直连，实测数据与官方逐期一致）
          // 校验：号码合法性 + 与仓库快照重叠期交叉核对 + 新期连续无跳期；任何不过即退出，绝不写坏数据。
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";
          const fs = await import("node:fs");
          const OFFICIAL = "https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=85&provinceId=0&pageSize=30&isVerify=1&pageNo=1";
          const MIRROR = "https://datachart.500.com/dlt/history/inc/history.php?limit=30";
          const HO = { "User-Agent": UA, "Accept": "application/json, text/plain, */*", "Referer": "https://static.sporttery.cn/", "Origin": "https://static.sporttery.cn" };
          const HM = { "User-Agent": UA, "Accept": "*/*", "Referer": "https://datachart.500.com/dlt/history/history.shtml" };
          async function get(url, headers) {
            let lastErr;
            for (let a = 1; a <= 2; a++) {
              try {
                const r = await fetch(url, { headers });
                if (!r.ok) throw new Error("HTTP " + r.status);
                return await r.text();
              } catch (e) { lastErr = e; }
            }
            throw lastErr;
          }
          let draws = [];
          try {
            const j = JSON.parse(await get(OFFICIAL, HO));
            for (const x of j?.value?.list || []) {
              const n = (x.lotteryDrawResult || "").trim().split(/\s+/).map(Number);
              if (n.length !== 7) continue;
              draws.push([parseInt(x.lotteryDrawNum, 10), String(x.lotteryDrawTime).slice(0, 10),
                n.slice(0, 5).sort((a, b) => a - b), n.slice(5).sort((a, b) => a - b)]);
            }
            console.log("source=official rows=" + draws.length);
          } catch (e) { console.log("source=official failed:", e.message); }
          if (!draws.length) {
            const html = (await get(MIRROR, HM)).replace(/<!--[\s\S]*?-->/g, "");
            const rows = html.match(/<tr[^>]*class="t_tr1"[\s\S]*?<\/tr>/gi) || [];
            for (const tr of rows) {
              const tds = (tr.match(/<td[^>]*>([\s\S]*?)<\/td>/gi) || []).map(x => x.replace(/<[^>]*>/g, "").trim());
              const issue = tds.find(v => /^\d{5}$/.test(v));
              const date = tds.find(v => /^\d{4}-\d{2}-\d{2}$/.test(v));
              if (!issue || !date) continue;
              const k = tds.indexOf(issue);
              const f = tds.slice(k + 1, k + 6).map(Number).sort((a, b) => a - b);
              const b = tds.slice(k + 6, k + 8).map(Number).sort((a, b) => a - b);
              const okF = f.length === 5 && new Set(f).size === 5 && f.every(v => v >= 1 && v <= 35);
              const okB = b.length === 2 && new Set(b).size === 2 && b.every(v => v >= 1 && v <= 12);
              if (okF && okB) draws.push([parseInt(issue, 10), date, f, b]);
            }
            console.log("source=500mirror rows=" + draws.length);
          }
          if (!draws.length) { console.error("both sources failed"); process.exit(1); }
          const cur = JSON.parse(fs.readFileSync("data_snapshot.json", "utf8"));
          const maxOld = cur.draws[0][0];
          // 交叉核对：与本地快照重叠的期号，号码与日期必须完全一致
          for (const d of draws) {
            const old = cur.draws.find(t => t[0] === d[0]);
            if (old && (old[1] !== d[1] || JSON.stringify(old[2]) !== JSON.stringify(d[2]) || JSON.stringify(old[3]) !== JSON.stringify(d[3]))) {
              console.error("cross-check mismatch at draw", d[0]); process.exit(1);
            }
          }
          const fresh = draws.filter(d => d[0] > maxOld).sort((a, b) => b[0] - a[0]);
          // 连续性：新期必须从 maxOld+1 连续递增，不允许跳期
          for (let k = 0; k < fresh.length; k++) {
            if (fresh[k][0] !== maxOld + fresh.length - k) { console.error("gap detected near", fresh[k][0]); process.exit(1); }
          }
          if (!fresh.length) { console.log("already up to date at", maxOld); process.exit(0); }
          cur.draws = [...fresh, ...cur.draws];
          cur.total = cur.draws.length;
          cur.updated = cur.draws[0][1];
          fs.writeFileSync("data_snapshot.json", JSON.stringify(cur));
          console.log("added", fresh.length, "draw(s); latest =", cur.draws[0][0]);
          EOF
          node update.mjs
      - name: Commit & push
        run: |
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_snapshot.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: auto update $(date -u +%F)"
            git push
          fi
